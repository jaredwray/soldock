<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover lets the page use the full screen of a phone: the CSS adds env(safe-area-inset-*)
		     next to the notch and the home indicator. interactive-widget=resizes-content makes Android make
		     the page smaller above the on-screen keyboard. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="referrer" content="no-referrer" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>Asterra</title>
	</head>
	<body>
		<!-- dock tests and the smoke check look for data-asterra-shell in the served index.html. -->
		<div id="root" data-asterra-shell></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
