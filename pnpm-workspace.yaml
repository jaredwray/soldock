packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Packages allowed to run install scripts. pnpm 11 blocks all others and fails the install on an
# unapproved one (strictDepBuilds). Each entry is a reviewed exception: both fetch or validate the
# platform-specific binaries that wrangler and the workerd test runner need.
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true # fail instead of falling back to a too-new version
minimumReleaseAgeIgnoreMissingTime: false # missing publish-time metadata fails closed
