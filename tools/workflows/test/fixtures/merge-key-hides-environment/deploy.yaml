# Fails: a YAML merge key adds environment: to a pull_request job.
name: deploy
on:
  pull_request:
permissions:
  contents: read
x-staging: &staging
  environment: staging
jobs:
  deploy:
    <<: *staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo deploy
