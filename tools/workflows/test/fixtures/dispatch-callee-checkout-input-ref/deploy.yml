# Fails: a local callee of a privileged workflow checks out a dispatch input.
name: deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo deploy
