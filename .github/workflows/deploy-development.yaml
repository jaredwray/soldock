name: deploy-development

# Continuous deployment: each push to main builds the release bundle of the operator CLI and runs
# `asterra upgrade` on the development instance (`soldock-dock-dev`, at https://work.soldock.org), as an
# operator runs `npx asterra upgrade`. The CLI checks the schema, applies the D1 migrations, deploys,
# runs the smoke check, and rolls back to the earlier version when the smoke check fails. The
# development instance keeps the resource names from before the CLI (prefix `soldock`).
#
# This workflow uses the development Cloudflare token, so it follows the workflow rules in
# docs/self-hosting.md:
# - push to main and workflow_dispatch are the only triggers.
# - The job uses the development environment, which accepts runs of main only.
# - The checkout keeps no credentials and checks out only github.sha.
# - The workflow has no inputs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Two merges never interleave. A queued run waits, and then deploys the newest commit.
concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # This step runs first and gets no secret values, only whether each secret is set.
      - name: Check the run and the development configuration
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploy main only."
            exit 1
          fi
          missing=()
          [[ "$HAS_API_TOKEN" == "true" ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ "$HAS_ACCOUNT_ID" == "true" ]] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::The development environment does not have: ${list%, }. See docs/self-hosting.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache: a restored pnpm store skips the downloads that Socket Firewall examines.
          package-manager-cache: false
      # Only the Worker, the SPA, the CLI and the workspace packages that they use, and no secrets in this step.
      - run: sfw pnpm install --frozen-lockfile --filter "@asterra/dock..." --filter "@asterra/web..." --filter "asterra..."

      # The release bundle holds the Worker, the SPA as its assets, the migrations and the config template.
      - name: Build the release bundle
        run: |
          pnpm build
          pnpm release:build
          pnpm --filter asterra build

      # The CLI uses the wrangler of apps/dock: `pnpm exec` puts it on PATH. The CLI writes the URL and the
      # version to GITHUB_OUTPUT.
      - name: Upgrade the development instance with the CLI
        id: deploy
        working-directory: apps/dock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec node ../../tools/cli/dist/bin.js upgrade --yes
          --prefix soldock --worker-name soldock-dock-dev --hostname work.soldock.org

      - name: Write the job summary
        if: ${{ always() && steps.deploy.outputs.url != '' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          # GET /auth/setup is public. Before setup it returns setup_needed: true.
          setup=$(curl --silent --max-time 10 "$URL/auth/setup" | jq -r '.setup_needed | tostring' 2> /dev/null || true)
          case "$setup" in
            true) setup_line="not done. Open $URL and follow the page (docs/self-hosting.md, First-run setup)." ;;
            false) setup_line="done" ;;
            *) setup_line="unknown" ;;
          esac
          case "$OUTCOME" in
            success) upgrade_line="passed" ;;
            *) upgrade_line="failed. The CLI rolled back to the earlier version when the smoke check failed. See the step log." ;;
          esac
          {
            echo "## Development deploy"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Worker version: \`${VERSION:-unknown}\`"
            echo "- Host: $URL"
            echo "- Upgrade and smoke check: $upgrade_line"
            echo "- First-run setup: $setup_line"
          } >> "$GITHUB_STEP_SUMMARY"
