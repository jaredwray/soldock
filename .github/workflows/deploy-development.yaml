name: deploy-development

# Continuous deployment (S00.T09): each push to main deploys the dock Worker to the development
# environment (`soldock-dock-dev`, wrangler `--env development`), then runs the smoke check against
# its workers.dev host. Production deploys come with S05.T25. The dock Worker has no other
# deployment environment.
#
# This workflow uses the development Cloudflare token, so it follows ADR-0015 item 3:
# - push to main and workflow_dispatch are the only triggers.
# - The job uses the development environment, which accepts runs of main only.
# - The checkout keeps no credentials and checks out only github.sha.
# - The workflow has no inputs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Two merges never interleave. A queued run waits, and then deploys the newest commit.
concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # This step runs first and gets no secret values, only whether each secret is set.
      - name: Check the run and the development configuration
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploy main only (ADR-0015)."
            exit 1
          fi
          missing=()
          [[ "$HAS_API_TOKEN" == "true" ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ "$HAS_ACCOUNT_ID" == "true" ]] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::The development environment does not have: ${list%, }. See docs/self-hosting.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache: a restored pnpm store skips the downloads that Socket Firewall examines.
          package-manager-cache: false
      # Only the dock Worker and the workspace packages that it uses, and no secrets in this step.
      - run: sfw pnpm install --frozen-lockfile --filter "@soldock/dock..."

      # Deploys the placeholder page until S00.T05. Then this job runs `pnpm build` first.
      - name: Deploy the dock Worker to development
        id: deploy
        working-directory: apps/dock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm run deploy:development
          url=$(jq -rn '[inputs | select(.type == "deploy") | .targets[]? | select(test("^https://[^/]+\\.workers\\.dev$"))]
            | first // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          version=$(jq -rn '[inputs | select(.type == "deploy") | .version_id] | first // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [[ -z "$url" ]]; then
            echo "::error::The deploy output has no workers.dev URL. Make sure that the account has a workers.dev subdomain."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke check the development host
        id: smoke
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: scripts/smoke-check.sh "$URL"

      - name: Write the job summary
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Development deploy"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Worker version: \`${VERSION:-unknown}\`"
            echo "- Host: $URL"
            echo "- Smoke check: $SMOKE"
          } >> "$GITHUB_STEP_SUMMARY"
