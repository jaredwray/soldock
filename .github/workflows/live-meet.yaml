name: live-meet

# The Meet tests against the real Cloudflare Realtime SFU and TURN service. A pull request runs the same Meet tests
# against a stand-in SFU (e2e/support/fake-sfu.ts), which proves the gate and the client, but not the paths of
# Cloudflare. This run proves those paths. It runs the built Worker in `wrangler dev` on the runner, with the
# Realtime secrets of the development environment. It deploys nothing and changes no data of the development host.
#
# This workflow uses secrets of the development environment, so it follows the workflow rules in
# docs/self-hosting.md:
# - workflow_dispatch is the only trigger.
# - The job uses the development environment, which accepts runs of main only.
# - The checkout keeps no credentials and checks out only github.sha.
# - The workflow has no inputs.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-meet
  cancel-in-progress: false

jobs:
  live-meet:
    name: live-meet
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # This step runs first and gets no secret values, only whether each secret is set.
      - name: Check the run and the Meet configuration
        env:
          HAS_APP_SECRET: ${{ secrets.MEET_REALTIME_APP_SECRET != '' }}
          HAS_TURN_TOKEN: ${{ secrets.MEET_TURN_KEY_TOKEN != '' }}
          APP_ID: ${{ vars.MEET_REALTIME_APP_ID }}
          TURN_KEY_ID: ${{ vars.MEET_TURN_KEY_ID }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Dispatch this workflow on main only."
            exit 1
          fi
          missing=()
          [[ "$HAS_APP_SECRET" == "true" ]] || missing+=("secret MEET_REALTIME_APP_SECRET")
          [[ "$HAS_TURN_TOKEN" == "true" ]] || missing+=("secret MEET_TURN_KEY_TOKEN")
          [[ -n "$APP_ID" ]] || missing+=("variable MEET_REALTIME_APP_ID")
          [[ -n "$TURN_KEY_ID" ]] || missing+=("variable MEET_TURN_KEY_ID")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::The development environment does not have: ${list%, }. See docs/self-hosting.md#meet."
            exit 1
          fi
          id_re='^[0-9a-f]{32}$'
          if [[ ! "$APP_ID" =~ $id_re || ! "$TURN_KEY_ID" =~ $id_re ]]; then
            echo "::error::MEET_REALTIME_APP_ID and MEET_TURN_KEY_ID must each be 32 hexadecimal characters."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache: a restored pnpm store skips the downloads that Socket Firewall examines.
          package-manager-cache: false
      - run: sfw pnpm install --frozen-lockfile
      - name: Build the SPA (apps/web)
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @asterra/e2e exec playwright install --with-deps chromium

      # wrangler dev reads apps/dock/.dev.vars. Only this user can read the file, and no secret is on a command line.
      - name: Write the Realtime secrets for wrangler dev
        working-directory: apps/dock
        env:
          APP_ID: ${{ vars.MEET_REALTIME_APP_ID }}
          APP_SECRET: ${{ secrets.MEET_REALTIME_APP_SECRET }}
          TURN_KEY_ID: ${{ vars.MEET_TURN_KEY_ID }}
          TURN_TOKEN: ${{ secrets.MEET_TURN_KEY_TOKEN }}
        run: |
          umask 077
          {
            printf 'REALTIME_APP_ID=%s\n' "$APP_ID"
            printf 'REALTIME_APP_SECRET=%s\n' "$APP_SECRET"
            printf 'REALTIME_TURN_KEY_ID=%s\n' "$TURN_KEY_ID"
            printf 'REALTIME_TURN_KEY_TOKEN=%s\n' "$TURN_TOKEN"
          } > .dev.vars

      - name: Meet tests against Cloudflare Realtime
        env:
          MEET_LIVE: "1"
          MEET_LIVE_REPORT: ${{ runner.temp }}/meet-live-paths.ndjson
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/meet-live-results.json
        run: pnpm --filter @asterra/e2e exec playwright test tests/meet.spec.ts tests/meetLive.spec.ts --workers 1 --reporter=list,json

      - name: Remove the Realtime secrets
        if: always()
        run: rm -f apps/dock/.dev.vars

      - name: Write the job summary
        if: always()
        env:
          RESULTS: ${{ runner.temp }}/meet-live-results.json
          PATHS: ${{ runner.temp }}/meet-live-paths.ndjson
        run: |
          {
            echo "## Meet against Cloudflare Realtime"
            echo
            echo "| Test | Result |"
            echo "| --- | --- |"
            if [[ -f "$RESULTS" ]]; then
              jq -r '.. | objects | select(has("specs")) | .specs[] | "| \(.title) | \(.tests[0].results[-1].status // "not run") |"' "$RESULTS"
            else
              echo "| (no results) | not run |"
            fi
            echo
            echo "| Network path | Selected ICE pair |"
            echo "| --- | --- |"
            if [[ -f "$PATHS" ]]; then
              jq -r '"| \(.path) | \(.result // "none" | tostring) |"' "$PATHS"
            else
              echo "| (none) | not run |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meet-live-results
          path: |
            ${{ runner.temp }}/meet-live-results.json
            ${{ runner.temp }}/meet-live-paths.ndjson
          if-no-files-found: ignore
          retention-days: 14
