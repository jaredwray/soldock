name: release

# Publishes the operator CLI with its Asterra bundle to npm as `asterra` (`npx asterra install`), then
# makes the git tag v<version> and the GitHub Release. The release notes are in GitHub Releases only:
# the release starts with notes that GitHub makes from the merged pull requests. Edit them after the run.
#
# To release: merge a pull request that changes "version" in tools/cli/package.json (and
# tools/cli/release.json when an upgrade needs an earlier release first). Then open Actions › release ›
# Run workflow, and select main. docs/self-hosting.md (Releases) tells how to set up npm and the
# `release` environment before the first run.
#
# If a run publishes to npm and then fails, run the workflow again: it finds the version on npm without
# the tag, does not publish again, and makes the tag and the GitHub Release.
#
# The `build` job installs the dependencies and runs the tests, so it has no publish rights: it reads the
# repository only, and it does not use the release environment. It makes the package file. The `publish`
# job has the publish rights, installs nothing and runs no code of the repository: it downloads the
# package file, and gives it to npm.
#
# The workflow rules of docs/self-hosting.md apply:
# - workflow_dispatch is the only trigger, and the publish job uses the release environment, which accepts
#   runs of main only.
# - The checkout keeps no credentials and checks out only github.sha.
# - The workflow has no inputs. npm trusted publishing (OIDC) replaces an npm token.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The artifact that holds the package file, and the package name on npm.
  ARTIFACT: asterra-package
  PACKAGE: asterra

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      node: ${{ steps.version.outputs.node }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the run
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release main only."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache: a restored pnpm store skips the downloads that Socket Firewall examines.
          package-manager-cache: false

      # This step runs before the install, and reads only a JSON file. A version that cannot be a release
      # stops the run here.
      - name: Read the version
        id: version
        run: |
          version=$(jq -r '.version' tools/cli/package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tools/cli/package.json has the version \"$version\". A release needs x.y.z."
            exit 1
          fi
          if [[ "$version" == "0.0.0" ]]; then
            echo "::error::0.0.0 is the version of a package that has no release. Change the version in tools/cli/package.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - run: sfw pnpm install --frozen-lockfile

      # The same gate as CI, then the bundle and its dry runs.
      - name: Verify
        run: pnpm verify

      - name: Build the package file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter asterra build
          cp LICENSE tools/cli/LICENSE
          mkdir -p "$RUNNER_TEMP/package"
          cd tools/cli
          npm pack --pack-destination "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/$PACKAGE-$VERSION.tgz"

      - name: Upload the package file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/asterra
    permissions:
      # The tag and the GitHub Release.
      contents: write
      # npm trusted publishing and the provenance statement.
      id-token: write
      # The download of the package file of the build job.
      actions: read
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check the run
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release main only."
            exit 1
          fi
      # No checkout and no install: this job runs no code of the repository.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # A run that fails after the publish leaves the version on npm without the tag. The next run then
      # makes only the tag and the GitHub Release.
      - name: Find the version on npm and the tag
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # npm prints the version when it exists. For a version that does not exist, it prints nothing,
          # or fails with E404 when the package does not exist.
          if found=$(npm view "$PACKAGE@$VERSION" version 2>&1); then
            if [[ "$found" == "$VERSION" ]]; then on_npm=true; else on_npm=false; fi
          elif grep -q "E404" <<< "$found"; then
            on_npm=false
          else
            echo "::error::npm view failed, so the run cannot tell if $PACKAGE $VERSION is on npm."
            echo "$found"
            exit 1
          fi
          if answer=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1); then
            has_tag=true
          elif grep -q "HTTP 404" <<< "$answer"; then
            has_tag=false
          else
            echo "::error::The GitHub API failed, so the run cannot tell if the tag v$VERSION exists."
            echo "$answer"
            exit 1
          fi
          if [[ "$on_npm" == "true" && "$has_tag" == "true" ]]; then
            echo "::error::$PACKAGE $VERSION is on npm, and the tag v$VERSION exists. Change the version in tools/cli/package.json."
            exit 1
          fi
          if [[ "$has_tag" == "true" ]]; then
            echo "::error::The tag v$VERSION exists, but $PACKAGE $VERSION is not on npm. Delete the tag and its GitHub Release, or change the version."
            exit 1
          fi
          echo "on_npm=$on_npm" >> "$GITHUB_OUTPUT"

      - name: Download the package file
        if: ${{ steps.state.outputs.on_npm != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/$PACKAGE-$VERSION.tgz"

      - name: Publish to npm
        if: ${{ steps.state.outputs.on_npm != 'true' }}
        run: npm publish "$RUNNER_TEMP/package/$PACKAGE-$VERSION.tgz" --provenance --access public

      - name: Make the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Asterra $VERSION" --generate-notes
