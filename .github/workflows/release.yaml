name: release

# Publishes the operator CLI with its Asterra bundle to npm as `asterra` (`npx asterra install`), then
# makes the git tag v<version> and the GitHub Release. The release notes are in GitHub Releases only:
# the release starts with notes that GitHub makes from the merged pull requests. Edit them after the run.
#
# To release: merge a pull request that changes "version" in tools/cli/package.json (and
# tools/cli/release.json when an upgrade needs an earlier release first). Then open Actions › release ›
# Run workflow, and select main. docs/self-hosting.md (Releases) tells how to set up npm and the
# `release` environment before the first run.
#
# The workflow rules of docs/self-hosting.md apply:
# - workflow_dispatch is the only trigger, and the job uses the release environment, which accepts
#   runs of main only.
# - The checkout keeps no credentials and checks out only github.sha.
# - The workflow has no inputs. npm trusted publishing (OIDC) replaces an npm token.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/asterra
    permissions:
      # The tag and the GitHub Release.
      contents: write
      # npm trusted publishing and the provenance statement.
      id-token: write
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the run
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release main only."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.4"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          # No dependency cache: a restored pnpm store skips the downloads that Socket Firewall examines.
          package-manager-cache: false
      - run: sfw pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: |
          version=$(node -p 'require("./tools/cli/package.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tools/cli/package.json has the version \"$version\". A release needs x.y.z."
            exit 1
          fi
          if npm view "asterra@$version" version > /dev/null 2>&1; then
            echo "::error::asterra $version is on npm already. Change the version in tools/cli/package.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same gate as CI, then the bundle and its dry runs.
      - name: Verify
        run: pnpm verify

      - name: Build the package
        run: |
          pnpm --filter asterra build
          cp LICENSE tools/cli/LICENSE

      - name: Publish to npm
        working-directory: tools/cli
        run: npm publish --provenance --access public

      - name: Make the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Asterra $VERSION" --generate-notes
